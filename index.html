            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 0.8em;
        }
        .footer-text {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(to bottom, #ffffff 33%, #0033cc 33%, #0033cc 66%, #cc0000 66%, #cc0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 20px;
            letter-spacing: 2px;

        .footer {
